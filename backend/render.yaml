services:
  - type: web
    name: sahara-x-backend
    runtime: node
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sahara-x-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_VERSION
        value: 20.11.0

databases:
  - name: sahara-x-db
    plan: starter
    region: singapore
